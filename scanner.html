<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Entry Scanner · Sisters Squad</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    body {
      min-height:100vh;
      font-family:'Inter',sans-serif;
      background:radial-gradient(ellipse at top, #5c1733 0%, #4A1229 45%, #35081b 100%);
      color:#F5E9DA;
      display:flex; flex-direction:column; align-items:center;
      padding:0 16px 40px;
    }

    /* ---------- Header ---------- */
    .header { text-align:center; padding:26px 0 18px; }
    .header .event {
      font-family:'Playfair Display',serif;
      font-size:30px; font-weight:700; color:#E8B54A;
      text-shadow:0 2px 12px rgba(232,181,74,.25);
    }
    .header .sub {
      margin-top:5px; font-size:12px; font-weight:600;
      letter-spacing:3px; text-transform:uppercase; color:#c9a98f;
    }
    .divider {
      width:64px; height:2px; margin:14px auto 0;
      background:linear-gradient(90deg, transparent, #E8B54A, transparent);
    }

    /* ---------- Scanner ---------- */
    .scan-wrap {
      position:relative; width:100%; max-width:340px;
      border-radius:20px; overflow:hidden;
      border:1.5px solid rgba(232,181,74,.55);
      box-shadow:0 12px 40px rgba(0,0,0,.45), 0 0 0 6px rgba(232,181,74,.06);
      background:#2a0715;
    }
    #reader { width:100%; }
    #reader video { display:block; }

    .scanline {
      position:absolute; left:8%; right:8%; height:2px; top:15%;
      background:linear-gradient(90deg, transparent, #E8B54A, transparent);
      box-shadow:0 0 12px 2px rgba(232,181,74,.6);
      animation:sweep 2.2s ease-in-out infinite;
      pointer-events:none; display:none;
    }
    .scanning .scanline { display:block; }
    @keyframes sweep { 0%,100% { top:15%; } 50% { top:82%; } }

    .scan-idle {
      padding:44px 24px; text-align:center; color:#c9a98f; font-size:14px; line-height:1.6;
    }
    .scan-idle .icon { font-size:40px; margin-bottom:10px; }

    /* ---------- Buttons ---------- */
    .btn {
      margin-top:18px; padding:15px 34px;
      font-family:'Inter',sans-serif; font-size:16px; font-weight:700;
      color:#4A1229; background:linear-gradient(180deg, #f0c366, #E8B54A);
      border:none; border-radius:14px; cursor:pointer;
      box-shadow:0 6px 18px rgba(232,181,74,.35);
      transition:transform .12s ease;
    }
    .btn:active { transform:scale(.96); }
    .btn.ghost {
      background:transparent; color:#E8B54A;
      border:1.5px solid rgba(232,181,74,.6); box-shadow:none;
    }

    /* ---------- Result cards ---------- */
    .card {
      width:100%; max-width:340px; margin-top:20px;
      padding:26px 22px; border-radius:20px; text-align:center;
      animation:pop .35s cubic-bezier(.2,1.2,.4,1);
      box-shadow:0 14px 40px rgba(0,0,0,.4);
    }
    @keyframes pop { from { opacity:0; transform:translateY(14px) scale(.96); } }

    .card.ok  { background:linear-gradient(160deg, #1f7a42, #145c30); }
    .card.bad { background:linear-gradient(160deg, #a32424, #7c1616); }
    .card.wait{ background:linear-gradient(160deg, #7a6420, #5c4a14); }

    .card .status {
      font-size:13px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase;
      opacity:.95;
    }
    .card .name {
      font-family:'Playfair Display',serif;
      font-size:32px; font-weight:700; color:#fff; margin-top:10px; line-height:1.2;
      word-break:break-word;
    }
    .card .admit-chip {
      display:inline-block; margin-top:14px; padding:9px 22px;
      background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.35);
      border-radius:999px; font-size:19px; font-weight:700; color:#ffe9b8;
    }
    .card .detail { margin-top:12px; font-size:14px; opacity:.9; line-height:1.5; }
    .card .tid {
      margin-top:14px; font-size:12px; letter-spacing:2px; opacity:.7; font-weight:600;
    }

    /* ---------- Manual entry ---------- */
    .manual {
      margin-top:30px; width:100%; max-width:340px; text-align:center;
    }
    .manual .label {
      font-size:11px; font-weight:600; letter-spacing:2px; text-transform:uppercase;
      color:#c9a98f; margin-bottom:10px;
    }
    .manual .row {
      display:flex; align-items:stretch; gap:8px; justify-content:center;
    }
    .prefix {
      display:flex; align-items:center; padding:0 14px;
      background:rgba(232,181,74,.12); border:1.5px solid rgba(232,181,74,.4);
      border-radius:12px; font-weight:700; font-size:17px; color:#E8B54A;
      letter-spacing:1px;
    }
    .manual input {
      width:110px; padding:14px 12px; font-size:20px; font-weight:600;
      text-align:center; letter-spacing:3px;
      color:#4A1229; background:#F5E9DA;
      border:none; border-radius:12px; outline:none;
      font-family:'Inter',sans-serif;
    }
    .manual input::placeholder { color:#b09b86; letter-spacing:1px; font-size:15px; }
    .manual button {
      padding:0 22px; font-size:16px; font-weight:700;
      color:#4A1229; background:linear-gradient(180deg, #fbf2e3, #F5E9DA);
      border:none; border-radius:12px; cursor:pointer;
      font-family:'Inter',sans-serif;
    }
    .manual button:active { transform:scale(.96); }

    .footer {
      margin-top:auto; padding-top:36px; font-size:11px; color:#8f6f5c;
      letter-spacing:1px; text-align:center;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="event">बाईपण भारी 3.0</div>
    <div class="sub">Entry Check-in</div>
    <div class="divider"></div>
  </div>

  <div class="scan-wrap" id="scanWrap">
    <div id="reader"></div>
    <div class="scan-idle" id="scanIdle">
      <div class="icon">🎟️</div>
      Tap <b>Start camera</b> and point at the<br>QR code on the guest's pass
    </div>
    <div class="scanline"></div>
  </div>

  <button id="startBtn" class="btn" onclick="startScanner()">📷 Start camera</button>

  <div id="result" style="width:100%;max-width:340px;"></div>

  <div class="manual">
    <div class="label">Or enter ticket number</div>
    <div class="row">
      <div class="prefix">BPB3–</div>
      <input id="manualId" placeholder="e.g. 042" inputmode="numeric" maxlength="4"
             onkeydown="if(event.key==='Enter')manualCheck()">
      <button onclick="manualCheck()">Check</button>
    </div>
  </div>

  <div class="footer">Sister Quad Team · Kolhapur · 6 September 2026</div>

  <script>
    // ===== CONFIG: paste your Apps Script /exec URL here =====
    const API = 'https://script.google.com/macros/s/AKfycbxh3kl8PDG8PZZCYqoRI5ihv_6t3RP2NrgnWN2NoQCuK50CrmfBQBDUR22k0iTJEmkufg/exec';
    // =========================================================

    let scanner;

    function startScanner() {
      document.getElementById('result').innerHTML = '';
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('scanIdle').style.display = 'none';
      document.getElementById('scanWrap').classList.add('scanning');

      if (typeof Html5Qrcode === 'undefined') {
        showError('Scanner library failed to load. Check internet, or use the ticket number box below.');
        return;
      }

      scanner = new Html5Qrcode('reader');
      scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 220 }, onScan)
        .catch(function(err) {
          document.getElementById('startBtn').style.display = '';
          document.getElementById('scanIdle').style.display = '';
          document.getElementById('scanWrap').classList.remove('scanning');
          showError('Camera not available: ' + err + '<br><br>Use the ticket number box below.');
        });
    }

    function stopScanner() {
      document.getElementById('scanWrap').classList.remove('scanning');
      if (scanner) { try { scanner.stop().then(() => scanner.clear()); } catch (e) {} }
    }

    function showError(msg) {
      document.getElementById('result').innerHTML =
        '<div class="card bad"><div class="detail">' + msg + '</div></div>';
    }

    function onScan(text) {
      stopScanner();
      lookup(text);
    }

    function manualCheck() {
      let v = document.getElementById('manualId').value.trim();
      if (!v) return;
      if (/^\d+$/.test(v)) v = 'BPB3-' + v.padStart(3, '0');
      document.getElementById('manualId').value = '';
      document.getElementById('manualId').blur();
      stopScanner();
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('scanIdle').style.display = 'none';
      lookup(v);
    }

    function lookup(id) {
      document.getElementById('result').innerHTML =
        '<div class="card wait"><div class="status">Checking</div>' +
        '<div class="name" style="font-size:22px;">' + id + '</div></div>';
      fetch(API + '?ticket=' + encodeURIComponent(id))
        .then(r => r.json())
        .then(show)
        .catch(fail);
    }

    function show(r) {
      const breakdown = (r.adults || r.kids)
        ? '<div class="detail" style="margin-top:8px;font-size:16px;color:#fff;">' +
            (r.adults ? r.adults + ' Adult' + (r.adults > 1 ? 's' : '') : '') +
            (r.adults && r.kids ? ' &nbsp;·&nbsp; ' : '') +
            (r.kids ? r.kids + ' Kid' + (r.kids > 1 ? 's' : '') : '') +
          '</div>'
        : '';

      let html;
      if (r.ok) {
        html =
          '<div class="card ok">' +
            '<div class="status">✅ Welcome</div>' +
            '<div class="name">' + r.name + '</div>' +
            '<div class="admit-chip">👥 Admit ' + r.tickets + '</div>' +
            breakdown +
            '<div class="tid">' + r.id + '</div>' +
          '</div>';
      } else {
        html =
          '<div class="card bad">' +
            '<div class="status">⛔ ' + r.msg + '</div>' +
            (r.name ? '<div class="name">' + r.name + '</div>' : '') +
            (r.tickets ? '<div class="admit-chip">👥 Admit ' + r.tickets + '</div>' : '') +
            breakdown +
            '<div class="tid">' + (r.id || '') + '</div>' +
          '</div>';
      }
      html += '<div style="text-align:center;"><button class="btn" onclick="startScanner()">📷 Scan next guest</button></div>';
      document.getElementById('result').innerHTML = html;
    }

    function fail(e) {
      document.getElementById('result').innerHTML =
        '<div class="card bad"><div class="status">Connection problem</div>' +
        '<div class="detail">Could not reach the check-in service.<br>' +
        (e && e.message ? e.message : '') + '</div></div>' +
        '<div style="text-align:center;"><button class="btn ghost" onclick="startScanner()">Retry</button></div>';
    }
  </script>
</body>
</html>
