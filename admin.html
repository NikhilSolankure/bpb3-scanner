<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>बाईपण भारी नाईट 3.0 — Team Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    body {
      min-height:100vh;
      font-family:'Inter',sans-serif;
      background:radial-gradient(ellipse at top, #3a0d1a 0%, #2b0a12 42%, #12040a 100%);
      background-attachment:fixed;
      color:#f5e9da;
      padding:0 14px 50px;
    }

    /* ---------- Login gate ---------- */
    .gate {
      max-width:380px; margin:80px auto 0; text-align:center;
    }
    .gate .lock-icon { font-size:44px; }
    .gate h1 {
      font-family:'Playfair Display',serif; font-size:26px; color:#e6b422;
      margin-top:14px; font-weight:700;
    }
    .gate p { font-size:13px; color:#c9b394; margin-top:8px; }
    .gate input {
      width:100%; margin-top:22px; padding:15px 16px; font-size:16px; text-align:center;
      color:#f5e9da; background:rgba(0,0,0,.35); letter-spacing:2px;
      border:1.5px solid rgba(201,162,39,.4); border-radius:12px; outline:none;
    }
    .gate input:focus { border-color:#e6b422; }
    .gate button {
      width:100%; margin-top:14px; padding:15px; font-size:16px; font-weight:700;
      color:#2b0a12; background:linear-gradient(180deg,#f2ca5a,#e6b422);
      border:none; border-radius:12px; cursor:pointer;
    }
    .gate .err { color:#ffb3b3; font-size:13px; margin-top:12px; display:none; }

    /* ---------- Header ---------- */
    .top {
      max-width:440px; margin:0 auto; padding:24px 0 8px; text-align:center;
    }
    .top .org { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:#c9a227; }
    .top h1 {
      font-family:'Playfair Display',serif; font-size:24px; color:#e6b422; margin-top:5px; font-weight:700;
    }
    .top .refresh {
      margin-top:8px; font-size:12px; color:#c9b394; cursor:pointer;
      display:inline-flex; align-items:center; gap:5px;
    }

    /* ---------- Stat cards ---------- */
    .stats {
      max-width:440px; margin:16px auto 0;
      display:grid; grid-template-columns:repeat(2,1fr); gap:11px;
    }
    .stat {
      padding:16px 14px; border-radius:16px;
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
      border:1px solid rgba(201,162,39,.22);
    }
    .stat .n {
      font-family:'Playfair Display',serif; font-size:28px; font-weight:700; color:#e6b422;
      line-height:1;
    }
    .stat .l {
      font-size:11px; letter-spacing:1px; text-transform:uppercase; color:#b39b74; margin-top:6px;
    }
    .stat.rev .n { color:#7fe0a0; }
    .stat.pend .n { color:#f0b64a; }

    /* ---------- Tabs ---------- */
    .tabs {
      max-width:440px; margin:20px auto 0; display:flex; gap:8px;
      background:rgba(0,0,0,.25); padding:5px; border-radius:14px;
    }
    .tab {
      flex:1; padding:11px; text-align:center; font-size:13px; font-weight:600;
      color:#c9b394; border-radius:10px; cursor:pointer; transition:all .2s;
      display:flex; align-items:center; justify-content:center; gap:6px;
    }
    .tab.active { background:linear-gradient(180deg,#f2ca5a,#e6b422); color:#2b0a12; }
    .tab .badge {
      background:#c0392b; color:#fff; font-size:11px; font-weight:700;
      min-width:18px; height:18px; border-radius:9px; display:inline-flex;
      align-items:center; justify-content:center; padding:0 5px;
    }
    .tab.active .badge { background:#2b0a12; color:#f2ca5a; }

    /* ---------- Search ---------- */
    .search {
      max-width:440px; margin:16px auto 0; position:relative;
    }
    .search input {
      width:100%; padding:13px 16px 13px 42px; font-size:15px;
      color:#f5e9da; background:rgba(0,0,0,.3);
      border:1.5px solid rgba(201,162,39,.25); border-radius:12px; outline:none;
    }
    .search input:focus { border-color:#e6b422; }
    .search .icon {
      position:absolute; left:15px; top:50%; transform:translateY(-50%);
      color:#b39b74; font-size:16px;
    }
    .search input::placeholder { color:#7a6a55; }

    /* ---------- Booking list ---------- */
    .list { max-width:440px; margin:14px auto 0; }
    .booking {
      background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.012));
      border:1px solid rgba(201,162,39,.2); border-radius:16px;
      padding:16px 16px 14px; margin-bottom:12px;
      animation:slideIn .35s cubic-bezier(.2,1,.4,1);
    }
    @keyframes slideIn { from { opacity:0; transform:translateY(10px); } }
    @keyframes fadeOut { to { opacity:0; transform:scale(.94); height:0; margin:0; padding:0; border:0; } }
    .booking.removing { animation:fadeOut .4s forwards; overflow:hidden; }

    .b-top { display:flex; justify-content:space-between; align-items:flex-start; }
    .b-name { font-size:17px; font-weight:600; color:#fff; }
    .b-ref { font-size:12px; color:#c9a227; margin-top:2px; letter-spacing:.5px; }
    .b-badge {
      font-size:10px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
      padding:4px 10px; border-radius:8px; white-space:nowrap;
    }
    .bg-pending  { background:rgba(240,182,74,.18); color:#f0b64a; border:1px solid rgba(240,182,74,.4); }
    .bg-approved { background:rgba(127,224,160,.15); color:#7fe0a0; border:1px solid rgba(127,224,160,.35); }
    .bg-rejected { background:rgba(224,90,90,.15); color:#ff9d9d; border:1px solid rgba(224,90,90,.35); }
    .bg-confirmed{ background:rgba(140,180,240,.15); color:#a9c8f0; border:1px solid rgba(140,180,240,.3); }
    .bg-checked  { background:rgba(201,162,39,.18); color:#e6b422; border:1px solid rgba(201,162,39,.4); }

    .b-meta {
      display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:12px;
      font-size:13px; color:#d8c3a5;
    }
    .b-meta .item { display:flex; align-items:center; gap:5px; }
    .b-meta .item i { color:#b39b74; font-size:14px; }
    .b-amount { color:#7fe0a0; font-weight:700; }

    .b-actions { display:flex; gap:9px; margin-top:14px; }
    .b-actions button, .b-actions a {
      flex:1; padding:11px; font-size:13.5px; font-weight:700; text-align:center;
      border:none; border-radius:11px; cursor:pointer; text-decoration:none;
      display:flex; align-items:center; justify-content:center; gap:6px;
      font-family:'Inter',sans-serif;
    }
    .btn-approve { color:#0d3d20; background:linear-gradient(180deg,#8fe6ab,#5fce89); }
    .btn-reject  { color:#4a0f0f; background:rgba(224,90,90,.25); border:1px solid rgba(224,90,90,.5)!important; }
    .btn-wa      { color:#fff; background:linear-gradient(180deg,#3ec468,#25a052); }
    .btn-call    { color:#e6b422; background:transparent; border:1.5px solid rgba(201,162,39,.5)!important; flex:0 0 46px; }

    .empty { text-align:center; color:#9a8368; padding:50px 20px; font-size:14px; }
    .empty i { font-size:40px; display:block; margin-bottom:12px; opacity:.5; }

    .loading { text-align:center; padding:50px; color:#c9a227; font-size:14px; }
    .spin { animation:rot 1s linear infinite; display:inline-block; }
    @keyframes rot { to { transform:rotate(360deg); } }

    .toast {
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
      background:#1a0508; color:#f5e9da; padding:14px 22px; border-radius:12px;
      border:1px solid rgba(201,162,39,.5); font-size:14px; z-index:99;
      opacity:0; transition:opacity .3s; pointer-events:none; max-width:90%; text-align:center;
    }
    .toast.show { opacity:1; }
    .hidden { display:none; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div class="gate" id="gate">
    <div class="lock-icon">🔐</div>
    <h1>Team Dashboard</h1>
    <p>बाईपण भारी नाईट 3.0<br>Enter team password to continue</p>
    <input id="pw" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">Open Dashboard</button>
    <div class="err" id="gateErr">Wrong password — try again</div>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">
    <div class="top">
      <div class="org">Sisters Squad · Kolhapur</div>
      <h1>Team Dashboard</h1>
      <div class="refresh" onclick="loadAll()"><i class="ti ti-refresh" id="refIcon"></i> Tap to refresh</div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="tabs">
      <div class="tab active" id="tabPending" onclick="switchTab('pending')">
        Pending <span class="badge hidden" id="pendBadge">0</span>
      </div>
      <div class="tab" id="tabAll" onclick="switchTab('all')">All bookings</div>
    </div>

    <div class="search">
      <span class="icon"><i class="ti ti-search"></i></span>
      <input id="searchBox" placeholder="Search name, number or ref…" oninput="render()">
    </div>

    <div class="list" id="list">
      <div class="loading"><span class="spin"><i class="ti ti-loader-2"></i></span> Loading…</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <link href="https://unpkg.com/@tabler/icons-webfont@2.47.0/dist/tabler-icons.min.css" rel="stylesheet">
  <script>
    // ================= CONFIG =================
    const API = 'https://script.google.com/macros/s/AKfycbxh3kl8PDG8PZZCYqoRI5ihv_6t3RP2NrgnWN2NoQCuK50CrmfBQBDUR22k0iTJEmkufg/exec';
    // ==========================================

    let PW = '';
    let allBookings = [];
    let currentTab = 'pending';

    // ---------- Login ----------
    function login() {
      const pw = document.getElementById('pw').value.trim();
      if (!pw) return;
      PW = pw;
      document.getElementById('gateErr').style.display = 'none';
      document.querySelector('.gate button').textContent = 'Checking…';
      // validate by trying to load stats
      fetch(API + '?action=stats&pw=' + encodeURIComponent(pw))
        .then(r => r.json())
        .then(res => {
          if (!res.ok) {
            document.getElementById('gateErr').style.display = 'block';
            document.querySelector('.gate button').textContent = 'Open Dashboard';
            return;
          }
          try { sessionStorage.setItem('bpb3pw', pw); } catch(e){}
          document.getElementById('gate').classList.add('hidden');
          document.getElementById('app').classList.remove('hidden');
          renderStats(res);
          loadBookings();
        })
        .catch(() => {
          document.getElementById('gateErr').textContent = 'Connection problem — try again';
          document.getElementById('gateErr').style.display = 'block';
          document.querySelector('.gate button').textContent = 'Open Dashboard';
        });
    }

    // ---------- Load ----------
    function loadAll() {
      const icon = document.getElementById('refIcon');
      icon.classList.add('spin');
      Promise.all([
        fetch(API + '?action=stats&pw=' + encodeURIComponent(PW)).then(r => r.json()),
        fetch(API + '?action=bookings&pw=' + encodeURIComponent(PW)).then(r => r.json())
      ]).then(([stats, bk]) => {
        if (stats.ok) renderStats(stats);
        if (bk.ok) { allBookings = bk.bookings; render(); }
        icon.classList.remove('spin');
      }).catch(() => { icon.classList.remove('spin'); toast('Connection problem'); });
    }

    function loadBookings() {
      fetch(API + '?action=bookings&pw=' + encodeURIComponent(PW))
        .then(r => r.json())
        .then(res => { if (res.ok) { allBookings = res.bookings; render(); } })
        .catch(() => toast('Could not load bookings'));
    }

    // ---------- Stats ----------
    function renderStats(s) {
      const rev = '₹' + (s.revenue || 0).toLocaleString('en-IN');
      document.getElementById('stats').innerHTML =
        stat('ti-ticket', s.ticketsSold || 0, 'Tickets sold', '') +
        stat('ti-cash', rev, 'Revenue', 'rev') +
        stat('ti-clock', s.pending || 0, 'Pending', 'pend') +
        stat('ti-door-enter', s.checkedIn || 0, 'Checked in', '');
      const pb = document.getElementById('pendBadge');
      if (s.pending > 0) { pb.textContent = s.pending; pb.classList.remove('hidden'); }
      else pb.classList.add('hidden');
    }
    function stat(icon, n, label, cls) {
      return '<div class="stat ' + cls + '"><div class="n">' + n + '</div>' +
             '<div class="l">' + label + '</div></div>';
    }

    // ---------- Tabs ----------
    function switchTab(t) {
      currentTab = t;
      document.getElementById('tabPending').classList.toggle('active', t === 'pending');
      document.getElementById('tabAll').classList.toggle('active', t === 'all');
      render();
    }

    // ---------- Render list ----------
    function render() {
      const q = document.getElementById('searchBox').value.trim().toLowerCase();
      let items = allBookings.slice();

      if (currentTab === 'pending') items = items.filter(b => b.status === 'PENDING');
      if (q) items = items.filter(b =>
        (b.name || '').toLowerCase().includes(q) ||
        String(b.phone || '').includes(q) ||
        String(b.ref || '').toLowerCase().includes(q));

      const list = document.getElementById('list');
      if (!items.length) {
        list.innerHTML = '<div class="empty"><i class="ti ti-inbox"></i>' +
          (currentTab === 'pending' ? 'No pending bookings — all caught up!' : 'No bookings found') + '</div>';
        return;
      }
      list.innerHTML = items.map(card).join('');
    }

    function card(b) {
      const isOnline = b.channel === 'online';
      const admits = isOnline ? (Number(b.adults) + Number(b.kids)) : b.tickets;

      let badge, badgeClass;
      if (b.checkedIn) { badge = 'Checked in'; badgeClass = 'bg-checked'; }
      else if (b.status === 'PENDING')   { badge = 'Pending'; badgeClass = 'bg-pending'; }
      else if (b.status === 'APPROVED')  { badge = 'Approved'; badgeClass = 'bg-approved'; }
      else if (b.status === 'REJECTED')  { badge = 'Rejected'; badgeClass = 'bg-rejected'; }
      else { badge = 'Confirmed'; badgeClass = 'bg-confirmed'; }

      let meta = '<div class="item"><i class="ti ti-users"></i>Admit ' + admits + '</div>';
      if (isOnline) {
        meta += '<div class="item"><i class="ti ti-user"></i>' + b.adults + ' adult' + (b.adults>1?'s':'') +
                (b.kids>0 ? ', ' + b.kids + ' kid' + (b.kids>1?'s':'') : '') + '</div>';
        meta += '<div class="item"><i class="ti ti-cash"></i><span class="b-amount">₹' +
                Number(b.amount).toLocaleString('en-IN') + '</span></div>';
      }
      meta += '<div class="item"><i class="ti ti-phone"></i>' + b.phone + '</div>';

      let actions = '';
      if (isOnline && b.status === 'PENDING') {
        actions = '<div class="b-actions">' +
          '<button class="btn-approve" onclick="approve(\'' + b.ref + '\', this)"><i class="ti ti-check"></i>Approve</button>' +
          '<button class="btn-reject" onclick="reject(\'' + b.ref + '\', this)"><i class="ti ti-x"></i>Reject</button>' +
          '<a class="btn-call" href="tel:' + b.phone + '"><i class="ti ti-phone"></i></a>' +
          '</div>';
      } else if (b.waLink) {
        actions = '<div class="b-actions">' +
          '<a class="btn-wa" href="' + b.waLink + '" target="_blank"><i class="ti ti-brand-whatsapp"></i>Send pass on WhatsApp</a>' +
          '<a class="btn-call" href="tel:' + b.phone + '"><i class="ti ti-phone"></i></a>' +
          '</div>';
      }

      return '<div class="booking" id="bk-' + b.ref + '">' +
        '<div class="b-top"><div><div class="b-name">' + b.name + '</div>' +
        '<div class="b-ref">' + b.ref + (isOnline ? ' · online' : ' · phone') + '</div></div>' +
        '<div class="b-badge ' + badgeClass + '">' + badge + '</div></div>' +
        '<div class="b-meta">' + meta + '</div>' + actions + '</div>';
    }

    // ---------- Actions ----------
    function approve(ref, btn) {
      btn.innerHTML = '<span class="spin"><i class="ti ti-loader-2"></i></span>';
      btn.disabled = true;
      fetch(API + '?action=approve&pw=' + encodeURIComponent(PW) + '&ref=' + encodeURIComponent(ref))
        .then(r => r.json())
        .then(res => {
          if (res.ok) {
            toast('✅ ' + ref + ' approved — pass sent!');
            const el = document.getElementById('bk-' + ref);
            if (el) el.classList.add('removing');
            setTimeout(loadAll, 700);
          } else { toast('⚠️ ' + (res.msg || 'Failed')); btn.disabled = false; btn.innerHTML = '<i class="ti ti-check"></i>Approve'; }
        })
        .catch(() => { toast('Connection problem'); btn.disabled = false; btn.innerHTML = '<i class="ti ti-check"></i>Approve'; });
    }

    function reject(ref, btn) {
      if (!confirm('Reject booking ' + ref + '? The customer will not get a pass.')) return;
      btn.innerHTML = '<span class="spin"><i class="ti ti-loader-2"></i></span>';
      btn.disabled = true;
      fetch(API + '?action=reject&pw=' + encodeURIComponent(PW) + '&ref=' + encodeURIComponent(ref))
        .then(r => r.json())
        .then(res => {
          if (res.ok) {
            toast('Booking ' + ref + ' rejected');
            const el = document.getElementById('bk-' + ref);
            if (el) el.classList.add('removing');
            setTimeout(loadAll, 700);
          } else { toast('⚠️ ' + (res.msg || 'Failed')); btn.disabled = false; btn.innerHTML = '<i class="ti ti-x"></i>Reject'; }
        })
        .catch(() => { toast('Connection problem'); btn.disabled = false; btn.innerHTML = '<i class="ti ti-x"></i>Reject'; });
    }

    // ---------- Toast ----------
    let toastTimer;
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
    }

    // ---------- Auto-login if remembered ----------
    (function() {
      let saved = '';
      try { saved = sessionStorage.getItem('bpb3pw') || ''; } catch(e){}
      if (saved) { document.getElementById('pw').value = saved; login(); }
    })();
  </script>
</body>
</html>
