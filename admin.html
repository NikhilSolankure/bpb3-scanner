<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>बाईपण भारी नाईट 3.0 — Team Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      min-height:100vh; font-family:'Inter',sans-serif;
      background:radial-gradient(ellipse at top, #3a0d1a 0%, #2b0a12 42%, #12040a 100%);
      background-attachment:fixed; color:#f5e9da; padding:0 14px 50px;
    }

    .gate { max-width:380px; margin:80px auto 0; text-align:center; }
    .gate .lock { font-size:44px; }
    .gate h1 { font-family:'Playfair Display',serif; font-size:26px; color:#e6b422; margin-top:14px; }
    .gate p { font-size:13px; color:#c9b394; margin-top:8px; }
    .gate input {
      width:100%; margin-top:22px; padding:15px 16px; font-size:16px; text-align:center;
      color:#f5e9da; background:rgba(0,0,0,.35); letter-spacing:2px;
      border:1.5px solid rgba(201,162,39,.4); border-radius:12px; outline:none;
    }
    .gate input:focus { border-color:#e6b422; }
    .gate button {
      width:100%; margin-top:14px; padding:15px; font-size:16px; font-weight:700;
      color:#2b0a12; background:linear-gradient(180deg,#f2ca5a,#e6b422);
      border:none; border-radius:12px; cursor:pointer;
    }
    .gate .err { color:#ffb3b3; font-size:13px; margin-top:12px; display:none; }

    .top { max-width:460px; margin:0 auto; padding:22px 0 6px; text-align:center; }
    .top .org { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:#c9a227; }
    .top h1 { font-family:'Playfair Display',serif; font-size:23px; color:#e6b422; margin-top:5px; }
    .top .sync { margin-top:7px; font-size:11.5px; color:#8f7a5e; }
    .top .sync .dot {
      display:inline-block; width:7px; height:7px; border-radius:50%;
      background:#5fce89; margin-right:5px; vertical-align:1px;
    }
    .top .sync .dot.stale { background:#f0b64a; }

    .stats {
      max-width:460px; margin:14px auto 0;
      display:grid; grid-template-columns:repeat(3,1fr); gap:9px;
    }
    .stat {
      padding:13px 10px; border-radius:14px; text-align:center;
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
      border:1px solid rgba(201,162,39,.22);
    }
    .stat .n {
      font-family:'Playfair Display',serif; font-size:22px; font-weight:700; color:#e6b422; line-height:1;
    }
    .stat .l { font-size:9.5px; letter-spacing:1px; text-transform:uppercase; color:#b39b74; margin-top:5px; }
    .stat.rev .n { color:#7fe0a0; }
    .stat.pend .n { color:#f0b64a; }

    .tabs {
      max-width:460px; margin:16px auto 0; display:flex; gap:6px;
      background:rgba(0,0,0,.25); padding:5px; border-radius:14px;
    }
    .tab {
      flex:1; padding:11px 4px; text-align:center; font-size:12.5px; font-weight:600;
      color:#c9b394; border-radius:10px; cursor:pointer; transition:all .2s;
      display:flex; align-items:center; justify-content:center; gap:5px;
    }
    .tab.active { background:linear-gradient(180deg,#f2ca5a,#e6b422); color:#2b0a12; }
    .tab .badge {
      background:#c0392b; color:#fff; font-size:10.5px; font-weight:700;
      min-width:18px; height:18px; border-radius:9px; display:inline-flex;
      align-items:center; justify-content:center; padding:0 5px;
    }
    .tab .badge.green { background:#1f8a4a; }
    .tab.active .badge { background:#2b0a12; color:#f2ca5a; }

    .search { max-width:460px; margin:14px auto 0; position:relative; }
    .search input {
      width:100%; padding:13px 16px 13px 40px; font-size:15px; color:#f5e9da;
      background:rgba(0,0,0,.3); border:1.5px solid rgba(201,162,39,.25);
      border-radius:12px; outline:none;
    }
    .search input:focus { border-color:#e6b422; }
    .search input::placeholder { color:#7a6a55; }
    .search .sicon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#b39b74; }

    .list { max-width:460px; margin:12px auto 0; }
    .booking {
      background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.012));
      border:1px solid rgba(201,162,39,.2); border-radius:16px;
      padding:15px 15px 13px; margin-bottom:11px;
      border-left-width:4px;
      animation:slideIn .3s cubic-bezier(.2,1,.4,1);
    }
    .booking.src-phone  { border-left-color:#6ea8e8; }
    .booking.src-online { border-left-color:#e6b422; }
    @keyframes slideIn { from { opacity:0; transform:translateY(8px); } }
    @keyframes fadeOut { to { opacity:0; transform:scale(.95); } }
    .booking.removing { animation:fadeOut .35s forwards; }

    .b-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
    .b-name { font-size:16.5px; font-weight:600; color:#fff; }
    .b-ref { font-size:11.5px; color:#c9a227; margin-top:2px; letter-spacing:.4px; }
    .b-src {
      font-size:9.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase;
      padding:3px 8px; border-radius:6px; margin-left:6px;
    }
    .b-src.phone  { background:rgba(110,168,232,.15); color:#9cc4f0; border:1px solid rgba(110,168,232,.35); }
    .b-src.online { background:rgba(230,180,34,.13); color:#e6b422; border:1px solid rgba(230,180,34,.35); }
    .b-badge {
      font-size:10px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
      padding:4px 9px; border-radius:8px; white-space:nowrap;
    }
    .bg-pending  { background:rgba(240,182,74,.18); color:#f0b64a; border:1px solid rgba(240,182,74,.4); }
    .bg-approved { background:rgba(127,224,160,.15); color:#7fe0a0; border:1px solid rgba(127,224,160,.35); }
    .bg-rejected { background:rgba(224,90,90,.15); color:#ff9d9d; border:1px solid rgba(224,90,90,.35); }
    .bg-sent     { background:rgba(127,224,160,.15); color:#7fe0a0; border:1px solid rgba(127,224,160,.35); }
    .bg-checked  { background:rgba(201,162,39,.18); color:#e6b422; border:1px solid rgba(201,162,39,.4); }

    .b-meta {
      display:flex; flex-wrap:wrap; gap:5px 14px; margin-top:11px;
      font-size:12.5px; color:#d8c3a5;
    }
    .b-amount { color:#7fe0a0; font-weight:700; }

    .b-actions { display:flex; gap:8px; margin-top:13px; }
    .b-actions button, .b-actions a {
      flex:1; padding:11px 6px; font-size:13px; font-weight:700; text-align:center;
      border:none; border-radius:11px; cursor:pointer; text-decoration:none;
      font-family:'Inter',sans-serif;
      display:flex; align-items:center; justify-content:center; gap:5px;
    }
    .btn-approve { color:#0d3d20; background:linear-gradient(180deg,#8fe6ab,#5fce89); }
    .btn-reject  { color:#ffb3b3; background:rgba(224,90,90,.18); border:1px solid rgba(224,90,90,.45) !important; }
    .btn-wa      { color:#fff; background:linear-gradient(180deg,#3ec468,#25a052); }
    .btn-done    { color:#e6b422; background:transparent; border:1.5px solid rgba(201,162,39,.5) !important; }
    .btn-call    { color:#e6b422; background:transparent; border:1.5px solid rgba(201,162,39,.5) !important; flex:0 0 46px; }

    .empty { text-align:center; color:#9a8368; padding:46px 20px 30px; font-size:14px; }
    .empty .big { font-size:36px; display:block; margin-bottom:10px; opacity:.6; }
    .loading { text-align:center; padding:46px; color:#c9a227; font-size:14px; }
    .spin { display:inline-block; animation:rot 1s linear infinite; }
    @keyframes rot { to { transform:rotate(360deg); } }

    .toast {
      position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
      background:#1a0508; color:#f5e9da; padding:13px 20px; border-radius:12px;
      border:1px solid rgba(201,162,39,.5); font-size:13.5px; z-index:99;
      opacity:0; transition:opacity .3s; pointer-events:none; max-width:92%; text-align:center;
    }
    .toast.show { opacity:1; }
    .hidden { display:none; }
  </style>
</head>
<body>

  <div class="gate" id="gate">
    <div class="lock">🔐</div>
    <h1>Team Dashboard</h1>
    <p>बाईपण भारी नाईट 3.0<br>Enter team password</p>
    <input id="pw" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">Open Dashboard</button>
    <div class="err" id="gateErr">Wrong password — try again</div>
  </div>

  <div id="app" class="hidden">
    <div class="top">
      <div class="org">Sisters Squad · Kolhapur</div>
      <h1>Team Dashboard</h1>
      <div class="sync" id="sync"><span class="dot"></span>Auto-updating · tap any stat to refresh now</div>
    </div>

    <div class="stats" id="stats" onclick="loadAll(true)"></div>

    <div class="tabs">
      <div class="tab active" id="tab-pending" onclick="switchTab('pending')">
        Pending <span class="badge hidden" id="badge-pending">0</span>
      </div>
      <div class="tab" id="tab-tosend" onclick="switchTab('tosend')">
        To Send <span class="badge green hidden" id="badge-tosend">0</span>
      </div>
      <div class="tab" id="tab-all" onclick="switchTab('all')">All</div>
    </div>

    <div class="search">
      <span class="sicon">🔍</span>
      <input id="searchBox" placeholder="Search name, number or ref…" oninput="render()">
    </div>

    <div class="list" id="list"><div class="loading"><span class="spin">⏳</span> Loading…</div></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ================= CONFIG =================
    const API = 'https://script.google.com/macros/s/AKfycbxh3kl8PDG8PZZCYqoRI5ihv_6t3RP2NrgnWN2NoQCuK50CrmfBQBDUR22k0iTJEmkufg/exec';
    const REFRESH_SECONDS = 30;
    // ==========================================

    let PW = '', allBookings = [], currentTab = 'pending', refreshTimer = null, lastSync = 0;

    function login() {
      const pw = document.getElementById('pw').value.trim();
      if (!pw) return;
      document.querySelector('.gate button').textContent = 'Checking…';
      fetch(API + '?action=stats&pw=' + encodeURIComponent(pw))
        .then(r => r.json())
        .then(res => {
          if (!res.ok) {
            document.getElementById('gateErr').style.display = 'block';
            document.querySelector('.gate button').textContent = 'Open Dashboard';
            return;
          }
          PW = pw;
          try { sessionStorage.setItem('bpb3pw', pw); } catch (e) {}
          document.getElementById('gate').classList.add('hidden');
          document.getElementById('app').classList.remove('hidden');
          renderStats(res);
          loadBookings();
          startAutoRefresh();
        })
        .catch(() => {
          document.getElementById('gateErr').textContent = 'Connection problem — try again';
          document.getElementById('gateErr').style.display = 'block';
          document.querySelector('.gate button').textContent = 'Open Dashboard';
        });
    }

    // ---------- Auto-refresh ----------
    function startAutoRefresh() {
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(() => {
        if (document.visibilityState === 'visible') loadAll(false);
      }, REFRESH_SECONDS * 1000);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && Date.now() - lastSync > 15000) loadAll(false);
      });
    }

    function loadAll(showToast) {
      Promise.all([
        fetch(API + '?action=stats&pw=' + encodeURIComponent(PW)).then(r => r.json()),
        fetch(API + '?action=bookings&pw=' + encodeURIComponent(PW)).then(r => r.json())
      ]).then(([stats, bk]) => {
        if (stats.ok) renderStats(stats);
        if (bk.ok) { allBookings = bk.bookings; render(); }
        lastSync = Date.now();
        setSync(true);
        if (showToast) toast('Refreshed');
      }).catch(() => setSync(false));
    }

    function loadBookings() {
      fetch(API + '?action=bookings&pw=' + encodeURIComponent(PW))
        .then(r => r.json())
        .then(res => { if (res.ok) { allBookings = res.bookings; render(); lastSync = Date.now(); } })
        .catch(() => toast('Could not load bookings'));
    }

    function setSync(ok) {
      const dot = document.querySelector('#sync .dot');
      if (dot) dot.classList.toggle('stale', !ok);
      const s = document.getElementById('sync');
      if (s) s.childNodes[1].textContent = ok ? 'Auto-updating · tap any stat to refresh now'
                                             : 'Connection issue — retrying…';
    }

    // ---------- Stats ----------
    function renderStats(s) {
      document.getElementById('stats').innerHTML =
        stat('₹' + (s.revenue || 0).toLocaleString('en-IN'), 'Revenue', 'rev') +
        stat(s.ticketsSold || 0, 'Tickets sold', '') +
        stat((s.adults || 0) + ' / ' + (s.kids || 0), 'Adults / Kids', '') +
        stat(s.pending || 0, 'Pending', 'pend') +
        stat(s.toSend || 0, 'To send', '') +
        stat(s.checkedIn || 0, 'Checked in', '');
      badge('badge-pending', s.pending);
      badge('badge-tosend', s.toSend);
    }
    function stat(n, l, cls) {
      return '<div class="stat ' + cls + '"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>';
    }
    function badge(id, n) {
      const el = document.getElementById(id);
      if (n > 0) { el.textContent = n; el.classList.remove('hidden'); }
      else el.classList.add('hidden');
    }

    // ---------- Tabs ----------
    function switchTab(t) {
      currentTab = t;
      ['pending','tosend','all'].forEach(x =>
        document.getElementById('tab-' + x).classList.toggle('active', x === t));
      render();
    }

    // ---------- Render ----------
    function render() {
      const q = document.getElementById('searchBox').value.trim().toLowerCase();
      let items = allBookings.slice();

      if (currentTab === 'pending') items = items.filter(b => b.status === 'PENDING');
      if (currentTab === 'tosend')  items = items.filter(b => b.needsSending);
      if (q) items = items.filter(b =>
        (b.name || '').toLowerCase().includes(q) ||
        String(b.phone || '').includes(q) ||
        String(b.ref || '').toLowerCase().includes(q));

      const list = document.getElementById('list');
      if (!items.length) {
        const msgs = {
          pending: 'No pending bookings — all caught up!',
          tosend:  'Nothing to send — every pass delivered!',
          all:     'No bookings found'
        };
        list.innerHTML = '<div class="empty"><span class="big">🎟️</span>' + msgs[currentTab] + '</div>';
        return;
      }
      list.innerHTML = items.map(card).join('');
    }

    function card(b) {
      const admits = Number(b.adults) + Number(b.kids);
      const srcClass = b.source === 'phone' ? 'phone' : 'online';

      let badgeHtml, badgeClass;
      if (b.checkedIn)                    { badgeHtml = 'Checked in'; badgeClass = 'bg-checked'; }
      else if (b.status === 'PENDING')    { badgeHtml = 'Pending'; badgeClass = 'bg-pending'; }
      else if (b.status === 'REJECTED')   { badgeHtml = 'Rejected'; badgeClass = 'bg-rejected'; }
      else if (b.status === 'APPROVED' && b.waSent) { badgeHtml = 'Sent ✓'; badgeClass = 'bg-sent'; }
      else if (b.status === 'APPROVED')   { badgeHtml = 'Approved'; badgeClass = 'bg-approved'; }
      else                                { badgeHtml = b.status; badgeClass = 'bg-approved'; }

      let meta = '<div>👥 Admit ' + admits + '</div>' +
                 '<div>' + b.adults + ' adult' + (b.adults > 1 ? 's' : '') +
                 (b.kids > 0 ? ', ' + b.kids + ' kid' + (b.kids > 1 ? 's' : '') : '') + '</div>' +
                 '<div class="b-amount">₹' + Number(b.amount).toLocaleString('en-IN') + '</div>' +
                 '<div>📞 ' + b.phone + '</div>';

      let actions = '';
      if (b.status === 'PENDING') {
        actions =
          '<button class="btn-approve" onclick="approve(\'' + b.ref + '\', this)">✓ Approve</button>' +
          '<button class="btn-reject" onclick="reject(\'' + b.ref + '\', this)">✕ Reject</button>' +
          '<a class="btn-call" href="tel:' + b.phone + '">📞</a>';
      } else if (b.needsSending) {
        actions =
          '<a class="btn-wa" href="' + b.waLink + '" target="_blank">Send pass on WhatsApp</a>' +
          '<button class="btn-done" onclick="markSent(\'' + b.ref + '\', this)">Mark sent</button>';
      } else if (b.status === 'APPROVED' && b.waLink) {
        actions =
          '<a class="btn-wa" href="' + b.waLink + '" target="_blank">Resend on WhatsApp</a>' +
          '<a class="btn-call" href="tel:' + b.phone + '">📞</a>';
      }
      if (actions) actions = '<div class="b-actions">' + actions + '</div>';

      return '<div class="booking src-' + srcClass + '" id="bk-' + b.ref + '">' +
        '<div class="b-top"><div><div class="b-name">' + b.name + '</div>' +
        '<div class="b-ref">' + b.ref +
        '<span class="b-src ' + srcClass + '">' + (srcClass === 'phone' ? 'Phone' : 'Online') + '</span></div></div>' +
        '<div class="b-badge ' + badgeClass + '">' + badgeHtml + '</div></div>' +
        '<div class="b-meta">' + meta + '</div>' + actions + '</div>';
    }

    // ---------- Actions ----------
    function doAction(url, ref, btn, okMsg, restoreHtml) {
      btn.disabled = true;
      const prev = btn.innerHTML;
      btn.innerHTML = '<span class="spin">⏳</span>';
      fetch(url)
        .then(r => r.json())
        .then(res => {
          if (res.ok) {
            toast(okMsg);
            const el = document.getElementById('bk-' + ref);
            if (el) el.classList.add('removing');
            setTimeout(() => loadAll(false), 500);
          } else {
            toast('⚠️ ' + (res.msg || 'Failed'));
            btn.disabled = false; btn.innerHTML = restoreHtml || prev;
          }
        })
        .catch(() => { toast('Connection problem'); btn.disabled = false; btn.innerHTML = restoreHtml || prev; });
    }

    function approve(ref, btn) {
      doAction(API + '?action=approve&pw=' + encodeURIComponent(PW) + '&ref=' + encodeURIComponent(ref),
        ref, btn, '✅ ' + ref + ' approved — now in To Send', '✓ Approve');
    }

    function reject(ref, btn) {
      if (!confirm('Reject booking ' + ref + '? The customer will NOT get a pass.')) return;
      doAction(API + '?action=reject&pw=' + encodeURIComponent(PW) + '&ref=' + encodeURIComponent(ref),
        ref, btn, ref + ' rejected', '✕ Reject');
    }

    function markSent(ref, btn) {
      doAction(API + '?action=marksent&pw=' + encodeURIComponent(PW) + '&ref=' + encodeURIComponent(ref),
        ref, btn, '✅ ' + ref + ' marked as sent', 'Mark sent');
    }

    // ---------- Toast ----------
    let toastTimer;
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    // ---------- Auto-login ----------
    (function () {
      let s = '';
      try { s = sessionStorage.getItem('bpb3pw') || ''; } catch (e) {}
      if (s) { document.getElementById('pw').value = s; login(); }
    })();
  </script>
</body>
</html>
